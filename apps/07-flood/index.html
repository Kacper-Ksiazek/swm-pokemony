<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Powódź</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #101418;
        overflow: hidden;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        max-width: min(300px, calc(100vw - 64px));
        border-radius: 12px;
        background: rgb(16 20 24 / 0.78);
        color: #e8ecef;
        backdrop-filter: blur(6px);
      }
      .panel h1 {
        margin: 0;
        font-size: 18px;
      }
      .panel p {
        margin: 0;
        font-size: 13px;
        color: #aab4bc;
      }
      .panel label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        font-size: 13px;
      }
      .panel input[type="range"] {
        grid-column: 1 / -1;
      }
      .buttons {
        display: flex;
        gap: 8px;
      }
      .buttons button {
        flex: 1;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      #release {
        background: #2f7fd1;
        color: white;
      }
      #reset,
      .toggle,
      .tools button,
      #clear-walls {
        background: #3a434b;
        color: #e8ecef;
      }
      .tools {
        display: flex;
        gap: 4px;
      }
      .tools button {
        flex: 1;
        padding: 6px 4px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .tools button[aria-pressed="true"],
      .toggle[aria-pressed="true"] {
        background: #e8ecef;
        color: #101418;
      }
      .toggle,
      #clear-walls {
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .panel h2 {
        margin: 4px 0 0;
        font-size: 14px;
      }
      #view.building {
        cursor: crosshair;
      }
      #view.removing {
        cursor: not-allowed;
      }
      .buttons button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="panel">
      <h1>Powódź</h1>
      <label>
        Wysokość fali
        <output id="crest-value"></output>
        <input id="crest" type="range" min="2" max="12" step="0.5" value="7" />
      </label>
      <label>
        Pora dnia
        <output id="hour-value"></output>
        <input id="hour" type="range" min="5" max="23.5" step="0.25" value="19" />
      </label>
      <div class="buttons">
        <button id="release" disabled>Uwolnij falę</button>
        <button id="reset" disabled>Reset</button>
      </div>
      <p id="status">Ładowanie…</p>
      <div class="tools" role="group" aria-label="Kamera">
        <button data-cinema="free" aria-pressed="true">Swobodna</button>
        <button data-cinema="wave" aria-pressed="false">Za falą</button>
        <button data-cinema="plane" aria-pressed="false">Samolot</button>
      </div>
      <button id="storm" class="toggle" aria-pressed="false">Burza</button>
      <h2>Mury przeciwpowodziowe</h2>
      <div class="tools" role="group" aria-label="Narzędzie">
        <button data-tool="camera" aria-pressed="true">Kamera</button>
        <button data-tool="build" aria-pressed="false">Buduj</button>
        <button data-tool="remove" aria-pressed="false">Usuń</button>
      </div>
      <label>
        Wysokość muru
        <output id="wall-height-value"></output>
        <input id="wall-height" type="range" min="1" max="8" step="0.5" value="3" />
      </label>
      <button id="clear-walls">Usuń wszystkie mury</button>
      <p id="hint">Wybierz „Buduj” i przeciągnij po terenie, by postawić mur.</p>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
